name: Build Anchor Macro
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Unpack project
        run: |
          echo "" | base64 -d | tar xz
      - name: Build
        working-directory: anchormacro
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: anchormacro-jar
          path: anchormacro/build/libs/*.jar
          
