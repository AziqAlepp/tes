name: build

on:
  push:
  workflow_dispatch:

# Self-contained: this single file creates the whole Fabric 1.21.4 mod project and builds it.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Generate project files
        run: |
          cat > "build.gradle" <<'PVPEOF_0'
          plugins {
              id 'fabric-loom' version '1.9-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
          }

          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          PVPEOF_0
          cat > "gradle.properties" <<'PVPEOF_1'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.4
          yarn_mappings=1.21.4+build.8
          loader_version=0.16.10
          fabric_version=0.119.2+1.21.4
          mod_version=1.0.0
          maven_group=dev.pvputil
          archives_base_name=pvp-utility
          PVPEOF_1
          mkdir -p "gradle/wrapper"
          cat > "gradle/wrapper/gradle-wrapper.properties" <<'PVPEOF_2'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.12-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PVPEOF_2
          cat > "settings.gradle" <<'PVPEOF_3'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          PVPEOF_3
          mkdir -p "src/main/java/dev/pvputil/client"
          cat > "src/main/java/dev/pvputil/client/PvpUtilClient.java" <<'PVPEOF_4'
          package dev.pvputil.client;

          import dev.pvputil.config.ModConfig;
          import dev.pvputil.gui.PvpScreen;
          import dev.pvputil.keybinds.Keybinds;
          import dev.pvputil.modules.Modules;
          import dev.pvputil.modules.PvpModule;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          public class PvpUtilClient implements ClientModInitializer {
              public static final String MOD_ID = "pvputil";
              public static final Logger LOG = LoggerFactory.getLogger(MOD_ID);

              @Override
              public void onInitializeClient() {
                  ModConfig.load();
                  Keybinds.init();
                  Modules.init();

                  // All module logic runs here, on the client thread.
                  ClientTickEvents.END_CLIENT_TICK.register(mc -> {
                      while (Keybinds.OPEN_GUI.wasPressed()) {
                          if (mc.currentScreen == null) mc.setScreen(new PvpScreen(null));
                      }
                      for (PvpModule m : Modules.ALL) m.clientTick();
                  });
                  LOG.info("PvP Utility loaded with {} modules", Modules.ALL.size());
              }
          }
          PVPEOF_4
          mkdir -p "src/main/java/dev/pvputil/config"
          cat > "src/main/java/dev/pvputil/config/ModConfig.java" <<'PVPEOF_5'
          package dev.pvputil.config;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import dev.pvputil.client.PvpUtilClient;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.io.Reader;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.StandardCopyOption;
          import java.util.LinkedHashMap;
          import java.util.Map;

          /** JSON-backed settings (config/pvputil.json). Keybinds persist natively in options.txt. */
          public final class ModConfig {
              public static final class ModuleData {
                  public boolean enabled = true;
                  public Map<String, Integer> ints = new LinkedHashMap<>();
                  public Map<String, Boolean> flags = new LinkedHashMap<>();
              }

              public boolean feedback = true;
              public Map<String, ModuleData> modules = new LinkedHashMap<>();

              private static ModConfig instance = new ModConfig();
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

              private static Path path() {
                  return FabricLoader.getInstance().getConfigDir().resolve("pvputil.json");
              }

              public static ModConfig get() { return instance; }

              public static ModuleData data(String id) {
                  if (instance.modules == null) instance.modules = new LinkedHashMap<>();
                  ModuleData d = instance.modules.computeIfAbsent(id, k -> new ModuleData());
                  if (d.ints == null) d.ints = new LinkedHashMap<>();
                  if (d.flags == null) d.flags = new LinkedHashMap<>();
                  return d;
              }

              public static void load() {
                  Path p = path();
                  if (Files.exists(p)) {
                      try (Reader r = Files.newBufferedReader(p)) {
                          ModConfig c = GSON.fromJson(r, ModConfig.class);
                          if (c != null) instance = c;
                      } catch (Exception e) {
                          PvpUtilClient.LOG.error("Could not read config, using defaults", e);
                      }
                  }
                  save();
              }

              public static synchronized void save() {
                  Path p = path();
                  try {
                      Files.createDirectories(p.getParent());
                      Path tmp = p.resolveSibling("pvputil.json.tmp");
                      Files.writeString(tmp, GSON.toJson(instance));
                      Files.move(tmp, p, StandardCopyOption.REPLACE_EXISTING);
                  } catch (IOException e) {
                      PvpUtilClient.LOG.error("Could not save config", e);
                  }
              }
          }
          PVPEOF_5
          mkdir -p "src/main/java/dev/pvputil/gui"
          cat > "src/main/java/dev/pvputil/gui/PvpScreen.java" <<'PVPEOF_6'
          package dev.pvputil.gui;

          import dev.pvputil.config.ModConfig;
          import dev.pvputil.keybinds.Keybinds;
          import dev.pvputil.modules.BoolSetting;
          import dev.pvputil.modules.IntSetting;
          import dev.pvputil.modules.Modules;
          import dev.pvputil.modules.PvpModule;
          import net.fabricmc.loader.api.FabricLoader;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.text.OrderedText;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          /** Immediate-mode configuration screen: sidebar navigation + animated rounded panels. */
          public class PvpScreen extends Screen {
              // Palette: dark blue / soft blue / near-black navy / light blue accent
              static final int BG = 0xFF070B14, SIDEBAR = 0xFF0A1020, PANEL = 0xFF0E1630, PANEL_HI = 0xFF16224A;
              static final int PRIMARY = 0xFF1E3FA0, SOFT = 0xFF6F93D8, ACCENT = 0xFF9AD1FF;
              static final int TEXT = 0xFFFFFFFF, MUTED = 0xFF8696B5, WARN = 0xFFE5737F, OFF = 0xFF1C2542;

              private static final String[] NAMES = {"Home", "Anchor Macro", "Double Anchor", "Safe Anchor Crouch",
                      "Shield Breaker", "Fast XP", "Hit Crystal", "Settings"};

              private record Hit(int x, int y, int w, int h, boolean content, Runnable action) {
                  boolean in(double mx, double my) { return mx >= x && mx < x + w && my >= y && my < y + h; }
              }

              private final Screen parent;
              private final List<Hit> hits = new ArrayList<>();
              private final Map<String, Float> anim = new HashMap<>();
              private int page;
              private float pageAnim = 1f, fade = 1f, dt;
              private int scroll, maxScroll;
              private int mx, my;
              private int cx, cy, cw, ch;
              private boolean clipHover;
              private long last = System.nanoTime();
              private KeyBinding listening;
              private String error;
              private long errorUntil;

              public PvpScreen(Screen parent) {
                  super(Text.literal("PvP Utility"));
                  this.parent = parent;
              }

              @Override public boolean shouldPause() { return false; }
              @Override public void close() { client.setScreen(parent); }
              @Override public void removed() { ModConfig.save(); }

              private void setPage(int p) {
                  if (p == page) return;
                  page = p; pageAnim = 0f; scroll = 0; listening = null;
              }

              // ------------------------------------------------------------------ render
              @Override
              public void render(DrawContext c, int mouseX, int mouseY, float delta) {
                  mx = mouseX; my = mouseY;
                  long now = System.nanoTime();
                  dt = Math.min(0.1f, (now - last) / 1_000_000_000f);
                  last = now;
                  pageAnim = Math.min(1f, pageAnim + dt * 5f);
                  float e = 1f - (float) Math.pow(1f - pageAnim, 3);
                  hits.clear();

                  c.fill(0, 0, width, height, 0xC0020510);
                  int ww = Math.min(width - 12, 600), wh = Math.min(height - 12, 360);
                  int wx = (width - ww) / 2, wy = (height - wh) / 2;
                  rounded(c, wx - 1, wy - 1, ww + 2, wh + 2, 9, 0xFF16275A);
                  rounded(c, wx, wy, ww, wh, 8, BG);

                  // ---- sidebar
                  fade = 1f; clipHover = false;
                  int sw = Math.min(140, ww / 4 + 30);
                  rounded(c, wx + 5, wy + 5, sw, wh - 10, 6, SIDEBAR);
                  rounded(c, wx + 14, wy + 14, 22, 22, 6, PRIMARY);
                  c.drawText(textRenderer, "P", wx + 14 + (22 - textRenderer.getWidth("P")) / 2, wy + 21, ACCENT, false);
                  c.drawText(textRenderer, "PvP Utility", wx + 42, wy + 15, TEXT, false);
                  c.drawText(textRenderer, "Fabric client", wx + 42, wy + 26, MUTED, false);
                  for (int i = 0; i < NAMES.length; i++) {
                      int ny = wy + 46 + i * 22, nw = sw - 10;
                      boolean act = page == i;
                      float h = hv("nav" + i, hover(wx + 10, ny, nw, 20));
                      rounded(c, wx + 10, ny, nw, 20, 5, act ? PRIMARY : mix(SIDEBAR, PANEL_HI, h));
                      if (act) c.fill(wx + 10, ny + 4, wx + 12, ny + 16, ACCENT);
                      c.drawText(textRenderer, NAMES[i], wx + 19 + (int) (h * 2), ny + 6, act ? TEXT : mix(MUTED, TEXT, h), false);
                      final int idx = i;
                      hit(wx + 10, ny, nw, 20, () -> setPage(idx));
                  }
                  c.drawText(textRenderer, "v" + modVersion(), wx + 14, wy + wh - 18, MUTED, false);

                  // ---- content
                  cx = wx + sw + 14; cy = wy + 10; cw = ww - sw - 24; ch = wh - 20;
                  fade = e; clipHover = true;
                  c.enableScissor(cx - 2, cy, cx + cw + 2, cy + ch);
                  int y0 = cy - scroll + (int) ((1f - e) * 12f);
                  int end;
                  if (page == 0) end = drawHome(c, cx, y0, cw);
                  else if (page == NAMES.length - 1) end = drawSettings(c, cx, y0, cw);
                  else end = drawModule(c, Modules.ALL.get(page - 1), cx, y0, cw);
                  c.disableScissor();
                  maxScroll = Math.max(0, (end - y0) - ch + 6);
                  scroll = Math.max(0, Math.min(maxScroll, scroll));
              }

              // ------------------------------------------------------------------ pages
              private int drawHome(DrawContext c, int x, int y, int w) {
                  box(c, x, y, 34, 34, 9, PRIMARY);
                  scaled(c, "P", x + 12, y + 9, 2f, ACCENT);
                  scaled(c, "PvP Utility", x + 44, y + 2, 1.5f, TEXT);
                  txt(c, "Anchor, shield, XP and crystal helpers", x + 44, y + 22, MUTED);
                  y += 46;

                  String[][] info = {
                          {"Mod version", modVersion()},
                          {"Minecraft", version("minecraft")},
                          {"Fabric Loader", version("fabricloader")},
                          {"Fabric API", FabricLoader.getInstance().isModLoaded("fabric-api") ? "Loaded" : "Missing"}};
                  int gap = 6, iw = (w - gap * 3) / 4;
                  for (int i = 0; i < 4; i++) {
                      int ix = x + i * (iw + gap);
                      box(c, ix, y, iw, 32, 6, PANEL);
                      txt(c, info[i][0], ix + 8, y + 6, MUTED);
                      txt(c, info[i][1], ix + 8, y + 18, info[i][1].equals("Missing") ? WARN : TEXT);
                  }
                  y += 42;
                  txt(c, "MODULES", x, y, SOFT);
                  y += 14;

                  int cwid = (w - 6) / 2;
                  for (int i = 0; i < Modules.ALL.size(); i++) {
                      PvpModule m = Modules.ALL.get(i);
                      int bx = x + (i % 2) * (cwid + 6), by = y + (i / 2) * 44;
                      float h = hv("card" + i, hover(bx, by, cwid, 38));
                      box(c, bx, by, cwid, 38, 7, mix(PANEL, PANEL_HI, h));
                      txt(c, m.name, bx + 10, by + 8, TEXT);
                      txt(c, m.enabled() ? "Key: " + Keybinds.name(m.key) : "Disabled", bx + 10, by + 22, MUTED);
                      final int idx = i + 1;
                      hit(bx, by, cwid, 38, () -> setPage(idx));
                      int tx = bx + cwid - 40, ty = by + 12;
                      toggle(c, "ct" + i, tx, ty, m.enabled());
                      hit(tx - 2, ty - 2, 34, 18, () -> m.setEnabled(!m.enabled()));
                  }
                  return y + ((Modules.ALL.size() + 1) / 2) * 44;
              }

              private int drawModule(DrawContext c, PvpModule m, int x, int y, int w) {
                  scaled(c, m.name, x, y, 1.4f, TEXT);
                  y += 20;
                  for (OrderedText line : textRenderer.wrapLines(Text.literal(m.description), w)) {
                      c.drawText(textRenderer, line, x, y, fa(MUTED), false);
                      y += 10;
                  }
                  y += 6;

                  final String tid = m.id + "_enabled";
                  row(c, tid, x, y, w, "Enabled");
                  toggle(c, tid + "t", x + w - 40, y + 6, m.enabled());
                  hit(x, y, w, 26, () -> m.setEnabled(!m.enabled()));
                  y += 30;

                  y = keyRow(c, m.id + "_key", x, y, w, "Keybind", m.key);

                  for (IntSetting s : m.ints) {
                      y = s.slot() ? slotRow(c, m, s, x, y, w) : stepRow(c, m, s, x, y, w);
                  }
                  for (BoolSetting b : m.bools) {
                      String id = m.id + "_" + b.key();
                      row(c, id, x, y, w, b.label());
                      toggle(c, id + "t", x + w - 40, y + 6, m.get(b));
                      hit(x, y, w, 26, () -> m.set(b, !m.get(b)));
                      y += 30;
                  }
                  y += 4;
                  button(c, m.id + "_reset", x, y, 116, 20, "Reset to default", false, m::resetDefaults);
                  return y + 26;
              }

              private int drawSettings(DrawContext c, int x, int y, int w) {
                  scaled(c, "Settings", x, y, 1.4f, TEXT);
                  y += 20;
                  txt(c, "Global options. Module keybinds are saved by Minecraft (options.txt).", x, y, MUTED);
                  y += 18;
                  y = keyRow(c, "open_key", x, y, w, "Open menu key", Keybinds.OPEN_GUI);

                  row(c, "fb", x, y, w, "Action-bar feedback messages");
                  toggle(c, "fbt", x + w - 40, y + 6, ModConfig.get().feedback);
                  hit(x, y, w, 26, () -> { ModConfig.get().feedback = !ModConfig.get().feedback; ModConfig.save(); });
                  y += 34;

                  button(c, "reset_all", x, y, 140, 20, "Reset all modules", false, () -> {
                      for (PvpModule m : Modules.ALL) m.resetDefaults();
                      Keybinds.reset(Keybinds.OPEN_GUI);
                  });
                  y += 30;
                  txt(c, "Config file: .minecraft/config/pvputil.json", x, y, MUTED);
                  return y + 16;
              }

              // ------------------------------------------------------------------ rows
              private int keyRow(DrawContext c, String id, int x, int y, int w, String label, KeyBinding kb) {
                  row(c, id, x, y, w, label);
                  boolean lis = listening == kb;
                  button(c, id + "b", x + w - 112, y + 4, 104, 18, lis ? "Press a key..." : Keybinds.name(kb), lis,
                          () -> listening = (listening == kb ? null : kb));
                  y += 30;
                  if (lis) { txt(c, "ESC cancel  |  Del unbind", x + 4, y - 2, MUTED); y += 10; }
                  if (error != null && System.currentTimeMillis() < errorUntil) { txt(c, error, x + 4, y - 2, WARN); y += 10; }
                  return y;
              }

              private int slotRow(DrawContext c, PvpModule m, IntSetting s, int x, int y, int w) {
                  String id = m.id + "_" + s.key();
                  row(c, id, x, y, w, s.label());
                  int cur = m.get(s), bx = x + w - 8 - 9 * 17 + 2;
                  for (int i = 1; i <= 9; i++) {
                      int px = bx + (i - 1) * 17;
                      boolean sel = i == cur;
                      float h = hv(id + i, hover(px, y + 5, 15, 16));
                      box(c, px, y + 5, 15, 16, 4, sel ? SOFT : mix(0xFF18234A, 0xFF24366E, h));
                      String t = String.valueOf(i);
                      txt(c, t, px + (15 - textRenderer.getWidth(t)) / 2 + 1, y + 9, sel ? 0xFF06101F : mix(MUTED, TEXT, h));
                      final int v = i;
                      hit(px, y + 5, 15, 16, () -> m.set(s, v));
                  }
           
